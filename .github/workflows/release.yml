# Fabrique l'installateur Windows et le publie dans une Release GitHub
# à chaque tag de version (vX.Y.Z), créé par `npm run release`.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # ffmpeg est téléchargé par le script d'installation de ffmpeg-static, que les
      # versions récentes de npm peuvent ne plus lancer : sans lui, pas de films ni séries.
      - name: Vérifier ffmpeg
        shell: pwsh
        run: |
          if (-not (Test-Path node_modules/ffmpeg-static/ffmpeg.exe)) { node node_modules/ffmpeg-static/install.js }
          if (-not (Test-Path node_modules/ffmpeg-static/ffmpeg.exe)) { throw 'ffmpeg.exe manquant' }

      # Clé TMDB (traduction des fiches) : secret du dépôt, jamais dans le code.
      # Sans elle, l'appli marche avec les textes du fournisseur.
      - name: Clé TMDB
        shell: pwsh
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: |
          if ($env:TMDB_KEY) { [IO.File]::WriteAllText("$PWD/tmdb.key", $env:TMDB_KEY.Trim()) }
          else { Write-Warning 'Secret TMDB_KEY absent : fiches sans traduction' }

      # Clé OpenSubtitles (sous-titres à télécharger) : secret du dépôt, jamais dans le code.
      # Sans elle, le lecteur ne propose que les sous-titres contenus dans le fichier.
      - name: Clé OpenSubtitles
        shell: pwsh
        env:
          OPENSUBTITLES_KEY: ${{ secrets.OPENSUBTITLES_KEY }}
        run: |
          if ($env:OPENSUBTITLES_KEY) { [IO.File]::WriteAllText("$PWD/opensubtitles.key", $env:OPENSUBTITLES_KEY.Trim()) }
          else { Write-Warning 'Secret OPENSUBTITLES_KEY absent : pas de recherche de sous-titres en ligne' }

      - name: Fabriquer
        run: npx electron-builder --win --publish never

      # Release créée en une fois avec ses trois fichiers (installateur, blockmap,
      # latest.yml lu par les mises à jour automatiques).
      - name: Publier
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create $env:GITHUB_REF_NAME dist/TV-Setup.exe dist/TV-Setup.exe.blockmap dist/latest.yml `
            --title ($env:GITHUB_REF_NAME -replace '^v', '') --generate-notes

  # Appli Android TV : APK signé, ajouté à la Release créée par le job windows.
  # Clé de signature dans les secrets ANDROID_* ; sans eux, pas d'APK (jamais signé avec une autre clé :
  # les télés équipées ne pourraient plus se mettre à jour).
  android:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Fabriquer et publier
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          OPENSUBTITLES_KEY: ${{ secrets.OPENSUBTITLES_KEY }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then echo '::warning::Secrets ANDROID_* absents : pas d APK'; exit 0; fi
          export ANDROID_KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE"
          cd android
          ./gradlew assembleRelease --console=plain
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/TV.apk"
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/TV.apk" --clobber
