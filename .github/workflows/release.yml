# Fabrique l'installateur Windows et le publie dans une Release GitHub
# à chaque tag de version (vX.Y.Z), créé par `npm run release`.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # ffmpeg est téléchargé par le script d'installation de ffmpeg-static, que les
      # versions récentes de npm peuvent ne plus lancer : sans lui, pas de films ni séries.
      - name: Vérifier ffmpeg
        shell: pwsh
        run: |
          if (-not (Test-Path node_modules/ffmpeg-static/ffmpeg.exe)) { node node_modules/ffmpeg-static/install.js }
          if (-not (Test-Path node_modules/ffmpeg-static/ffmpeg.exe)) { throw 'ffmpeg.exe manquant' }

      - name: Fabriquer
        run: npx electron-builder --win --publish never

      # Release créée en une fois avec ses trois fichiers (installateur, blockmap,
      # latest.yml lu par les mises à jour automatiques).
      - name: Publier
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create $env:GITHUB_REF_NAME dist/TV-Setup.exe dist/TV-Setup.exe.blockmap dist/latest.yml `
            --title ($env:GITHUB_REF_NAME -replace '^v', '') --generate-notes
