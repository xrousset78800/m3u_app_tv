<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav id="tabs">
      <button data-type="guide">Programme</button>
      <button data-type="live">TV</button>
      <button data-type="vod">Films</button>
      <button data-type="series">Séries</button>
    </nav>
    <span id="sync-info"></span>
    <button id="sync" class="secondary">Mettre à jour le catalogue</button>
    <button id="logout" class="secondary" title="Vider le catalogue et oublier les identifiants">Se déconnecter</button>
  </header>

  <section id="onboarding" hidden>
    <h1>Connexion</h1>
    <p class="muted">
      Renseigne les accès <strong>Xtream Codes</strong> de ton abonnement IPTV (serveur, utilisateur, mot de passe),
      ou laisse-les se remplir depuis ta playlist.
    </p>

    <div class="fill-from">
      <label class="file-button">
        Choisir un fichier .m3u
        <input id="m3u-file" type="file" accept=".m3u,.m3u8" hidden>
      </label>
      <input id="m3u-link" type="url" placeholder="ou coller le lien de la playlist (http://…/get.php?username=…)">
    </div>

    <form id="login">
      <input name="server" placeholder="Serveur (ex. http://exemple.com:8080)" required>
      <input name="username" placeholder="Utilisateur" autocomplete="username" required>
      <input name="password" type="password" placeholder="Mot de passe" autocomplete="current-password" required>
      <button id="import">Se connecter et importer</button>
    </form>
    <p id="onboarding-text"></p>
  </section>

  <div id="app" hidden>
    <section id="guide" hidden>
      <div class="guide-bar">
        <select id="guide-category"></select>
        <div id="guide-times" class="days"></div>
      </div>
      <div id="guide-list"></div>
    </section>

    <aside>
      <select id="category"></select>
      <input id="search" type="search" placeholder="Rechercher…">
      <ul id="list"></ul>
      <button id="more" class="secondary" hidden>Afficher plus</button>
    </aside>

    <main>
      <div id="player" class="player">
        <video id="video" controls controlslist="nofullscreen" autoplay playsinline></video>
        <div class="controls">
          <div id="seek" hidden>
            <span id="time-current">0:00</span>
            <input id="seek-bar" type="range" min="0" step="1" value="0">
            <span id="time-total">0:00</span>
            <select id="audio-track" title="Piste audio"></select>
          </div>
          <button id="fullscreen" class="secondary" title="Plein écran (F)">⛶ Plein écran</button>
        </div>
      </div>
      <div id="status">Choisis une chaîne, un film ou une série.</div>
      <section id="details"></section>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
